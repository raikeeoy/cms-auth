name: Validate codebase and image

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:

jobs:
  lint-and-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - uses: actions/setup-node@v7.0.0
          with:
            node-version: 24
            cache: npm
        - name: Install dependencies and lint files
          run: |
            npm ci
            npm run lint
            npm test
        - name: Test commit linting
          if: ${{ hashFiles('commitlint.config.js') != '' }}
          run: |
            echo 'fix: make sure commitlint works' | npx commitlint
        - name: Save code coverage to artifact
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: code-coverage
            path: coverage/clover.xml
            retention-days: 5

  upload-coverage:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch code coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  docker-test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
      - upload-coverage
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # This repository's Dockerfile uses $CACHE_BUST to invalidate Docker layer caching. The
      # variable is passed to the Docker build action below.
      - name: Export $CACHE_BUST environment variable
        run: echo "CACHE_BUST=$(date +%FT%T%z)" >> $GITHUB_ENV

      # Docker Compose builds an image with a default name of 'idrc-cms-authenticator'. Building an
      # image with that name here and then using Docker Compose to start it in the next step. This
      # is a workaround because Compose does not support BuildKit/buildx, which is required for
      # GHA caching.
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: idrc-cms-authenticator
          builder: ${{ steps.builder.outputs.name }}
          build-args: CACHE_BUST=${{ env.CACHE_BUST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Docker Compose using built image
        run: docker compose up --detach

      - uses: gacts/install-hurl@ab6d0234456944b022ef7d1f594845af9561357d # v1.3.4
        with:
          version: 4.0.0

      - name: Run Docker integration tests
        run: bin/integration.sh http://localhost:3000/auth

      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "idrc-cms-authenticator"
          only-fixed: true
          cache-db: true
          output-format: table
